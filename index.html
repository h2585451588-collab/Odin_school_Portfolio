<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090b">
  <meta name="description" content="A learning design and game portfolio featuring Blanc Card, Learn — A Classroom RPG, and Master of Elements.">
  <title>Learning Through Play — Game Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307090b'/%3E%3Cpath d='M18 16h20a8 8 0 0 1 8 8v24H26a8 8 0 0 1-8-8V16Z' fill='none' stroke='%23f4f1e8' stroke-width='4'/%3E%3Cpath d='M27 29h19M27 38h12' stroke='%23ff5c47' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #f4f1e8;
      --muted: #a7abb1;
      --paper: #07090b;
      --line: rgba(244, 241, 232, .17);
      --accent: #b18462;
      --blue: #5d8bff;
      --teal: #77e1c1;
      --ease: cubic-bezier(.2, .75, .18, 1);
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 52% -10%, rgba(255, 92, 71, .10), transparent 31rem),
        var(--paper);
      font-family: "Arial Nova", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, a { font: inherit; }
    a { color: inherit; }
    button { color: inherit; }

    .page {
      min-height: 100svh;
      padding: 0 clamp(1rem, 3vw, 3rem);
    }

    .hero {
      display: grid;
      grid-template-columns: max-content max-content;
      align-items: center;
      gap: clamp(1.5rem, 4vw, 4rem);
      padding: clamp(2.5rem, 5vw, 4.6rem) 0 clamp(2.2rem, 4vw, 3.7rem);
    }

    .hero h1 {
      margin: 0;
      max-width: 11ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.2rem, 6.7vw, 7.1rem);
      font-weight: 400;
      letter-spacing: -.058em;
      line-height: .9;
      text-wrap: balance;
    }

    .hero h1 em { color: var(--accent); font-weight: 400; }

    .hero-role {
      margin: 0;
      color: #c4c6ca;
      font-size: clamp(.75rem, 1.15vw, .95rem);
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .projects {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(19rem, .75fr);
      grid-template-rows: repeat(2, minmax(16rem, 1fr));
      gap: clamp(.75rem, 1.35vw, 1.15rem);
      min-height: 36rem;
      padding: 0 0 clamp(1rem, 3vw, 2.5rem);
    }

    .project {
      --mx: 50%;
      --my: 50%;
      --project-accent: var(--accent);
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: .45rem;
      background: #0f1216;
      isolation: isolate;
      cursor: pointer;
      transition: border-color .35s ease, transform .55s var(--ease), opacity .35s ease;
    }

    .project[data-project="blanc"] { grid-row: 1 / 3; }
    .project[data-project="learn"] { --project-accent: var(--blue); }
    .project[data-project="elements"] { --project-accent: var(--teal); }

    .projects:hover .project { opacity: .68; }
    .projects .project:hover,
    .projects .project:focus-within { z-index: 1; opacity: 1; border-color: color-mix(in srgb, var(--project-accent) 68%, white 8%); transform: translateY(-.3rem); }

    .project::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(circle at var(--mx) var(--my), transparent 0 8%, rgba(0, 0, 0, .18) 35%, rgba(0, 0, 0, .56) 78%),
        linear-gradient(180deg, rgba(0,0,0,.08) 26%, rgba(0,0,0,.85) 100%);
      transition: background .25s ease;
    }

    .project-image {
      position: absolute;
      inset: -3%;
      z-index: -2;
      width: 106%;
      height: 106%;
      object-fit: cover;
      transform: scale(1.03) translate(calc((var(--mx) - 50%) * -.035), calc((var(--my) - 50%) * -.035));
      filter: saturate(.82) contrast(1.05);
      transition: transform 1.1s var(--ease), filter .5s ease;
    }

    .master-placeholder {
      background:
        linear-gradient(145deg, rgba(255,255,255,.42), transparent 48%),
        #aab3c1;
    }

    .project[data-project="blanc"] .master-placeholder {
      background:
        linear-gradient(145deg, rgba(255,255,255,.46), transparent 48%),
        #c4b9ab;
    }

    .project[data-project="elements"] .master-placeholder {
      background:
        linear-gradient(145deg, rgba(255,255,255,.42), transparent 48%),
        #aebdb4;
    }

    .project:hover .project-image,
    .project:focus-within .project-image {
      transform: scale(1.09) translate(calc((var(--mx) - 50%) * -.055), calc((var(--my) - 50%) * -.055));
      filter: saturate(1.06) contrast(1.06);
    }

    .project-content {
      position: absolute;
      inset: auto 0 0;
      padding: clamp(1.2rem, 2.2vw, 2rem);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 1rem;
    }

    .project-type {
      margin: 0 0 .65rem;
      color: rgba(255,255,255,.7);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .project h2 {
      margin: 0;
      max-width: 12ch;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 3.4vw, 4.2rem);
      font-weight: 400;
      line-height: .93;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .project:not([data-project="blanc"]) h2 { max-width: 15ch; font-size: clamp(1.85rem, 2.9vw, 3.1rem); }

    .project-summary {
      max-width: 28rem;
      max-height: 0;
      margin: 0;
      overflow: hidden;
      color: rgba(255,255,255,.76);
      font-size: .92rem;
      line-height: 1.55;
      opacity: 0;
      transform: translateY(.8rem);
      transition: max-height .6s var(--ease), opacity .4s ease, transform .6s var(--ease), margin .6s var(--ease);
    }

    .project:hover .project-summary,
    .project:focus-within .project-summary {
      max-height: 6rem;
      margin-top: 1rem;
      opacity: 1;
      transform: translateY(0);
    }

    .open-project {
      width: 3rem;
      height: 3rem;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 50%;
      background: rgba(4,5,7,.28);
      backdrop-filter: blur(9px);
      cursor: pointer;
      text-decoration: none;
      transition: color .25s ease, background .25s ease, border-color .25s ease, transform .5s var(--ease);
    }

    .project:hover .open-project,
    .open-project:focus-visible {
      color: #08090b;
      background: var(--project-accent);
      border-color: var(--project-accent);
      transform: rotate(-8deg) scale(1.08);
    }

    .open-project svg { width: 1.2rem; height: 1.2rem; }

    dialog {
      width: min(76rem, calc(100% - 2rem));
      max-height: calc(100svh - 2rem);
      padding: 0;
      overflow: hidden;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: .5rem;
      background: #0b0e12;
      box-shadow: 0 2rem 7rem rgba(0,0,0,.65);
    }

    dialog::backdrop { background: rgba(0,0,0,.76); backdrop-filter: blur(12px); }

    .case-study { display: grid; grid-template-columns: minmax(18rem, .88fr) 1.12fr; min-height: min(47rem, calc(100svh - 2rem)); }

    .case-visual { position: relative; min-height: 23rem; overflow: hidden; background: #111; }
    .case-visual img { width: 100%; height: 100%; object-fit: cover; }
    .case-visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.76)); }

    .case-body {
      max-height: min(47rem, calc(100svh - 2rem));
      padding: clamp(2rem, 5vw, 5rem);
      overflow-y: auto;
    }

    .close-dialog {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 3;
      width: 2.8rem;
      height: 2.8rem;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(7,9,11,.64);
      backdrop-filter: blur(8px);
      cursor: pointer;
    }

    .close-dialog:hover, .close-dialog:focus-visible { background: var(--ink); color: var(--paper); }

    .case-kicker { margin: 0 0 .75rem; color: var(--case-accent, var(--accent)); font-size: .72rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .case-body h3 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.5rem, 5vw, 5rem); font-weight: 400; letter-spacing: -.05em; line-height: .9; }
    .case-lede { max-width: 29rem; margin: 2rem 0 3rem; color: #c9cbd0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.25rem, 2vw, 1.65rem); line-height: 1.45; }
    .case-meta { display: flex; flex-wrap: wrap; gap: .6rem; padding-top: 2rem; border-top: 1px solid var(--line); }
    .case-meta span { padding: .65rem .85rem; border: 1px solid var(--line); border-radius: 99rem; color: var(--muted); font-size: .7rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }

    :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; gap: .8rem; align-items: start; }
      .hero h1 { max-width: 10ch; }
      .projects { grid-template-columns: 1fr; grid-template-rows: none; min-height: 0; }
      .project, .project[data-project="blanc"] { grid-row: auto; min-height: 30rem; }
      .projects:hover .project, .projects .project:hover, .projects .project:focus-within { opacity: 1; }
      .project-summary { max-height: 6rem; margin-top: 1rem; opacity: 1; transform: none; }
      .case-study { grid-template-columns: 1fr; }
      .case-visual { min-height: 15rem; max-height: 34vh; }
      .case-body { max-height: calc(66svh - 2rem); }
    }

    @media (max-width: 560px) {
      .hero { padding: 2.4rem 0 2rem; }
      .hero h1 { font-size: clamp(3rem, 15vw, 4.8rem); }
      .project { min-height: 28rem; }
      .project-content { grid-template-columns: 1fr auto; }
      .project h2 { font-size: 2.65rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .project-image { transform: none !important; }
    }

    /* Each project keeps the portfolio system while carrying its own game language. */
    .project[data-project="blanc"] {
      --project-accent: #ef664f;
      border-radius: 1.2rem;
    }
    .project[data-project="blanc"] .master-placeholder {
      background-color: #d8d0c2;
      background-image:
        radial-gradient(circle at 25% 24%, rgba(239,102,79,.72) 0 .28rem, transparent .32rem),
        radial-gradient(circle at 70% 58%, rgba(23,77,76,.62) 0 .22rem, transparent .27rem),
        linear-gradient(145deg, rgba(255,255,255,.48), transparent 48%);
      background-size: 3.2rem 3.2rem, 4.2rem 4.2rem, 100% 100%;
    }
    .project[data-project="learn"] {
      --project-accent: #d2a85f;
      border-radius: .2rem;
    }
    .project[data-project="learn"] .master-placeholder {
      background-color: #a8bbc7;
      background-image:
        linear-gradient(rgba(255,255,255,.22) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.22) 1px, transparent 1px),
        linear-gradient(145deg, rgba(255,255,255,.32), transparent 55%);
      background-size: 2rem 2rem, 2rem 2rem, 100% 100%;
    }
    .project[data-project="elements"] {
      --project-accent: #9b3b48;
      border-radius: .15rem;
      border-color: rgba(155,59,72,.54);
    }
    .project[data-project="elements"]::after {
      background:
        radial-gradient(circle at var(--mx) var(--my), transparent 0 8%, rgba(32,10,13,.2) 38%, rgba(0,0,0,.64) 82%),
        linear-gradient(165deg, rgba(123,33,50,.18), transparent 45%),
        linear-gradient(180deg, transparent 25%, rgba(0,0,0,.88) 100%);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="intro-title">
      <h1 id="intro-title">Odin <em>He</em></h1>
      <p class="hero-role">Game Designer</p>
    </section>

    <section class="projects" id="work" aria-label="Selected game projects">
      <article class="project" data-project="blanc">
        <div class="project-image master-placeholder" role="img" aria-label="Artwork placeholder for Blanc Card"></div>
        <div class="project-content">
          <div>
            <p class="project-type">Creative learning · Card game</p>
            <h2>Blanc Card</h2>
            <p class="project-summary">A card game you can play without reading.</p>
          </div>
          <a class="open-project" href="blanc-card/index.html" aria-label="Open Blanc Card project">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M9 6h9v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </article>

      <article class="project" data-project="learn">
        <div class="project-image master-placeholder" role="img" aria-label="Artwork placeholder for Learn — A Classroom RPG"></div>
        <div class="project-content">
          <div>
            <p class="project-type">Classroom design · Role-playing game</p>
            <h2>Learn — A Classroom RPG</h2>
            <p class="project-summary">Everyone can be a teacher.</p>
          </div>
          <a class="open-project" href="learn/index.html" aria-label="Open Learn — A Classroom RPG project">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M9 6h9v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </article>

      <article class="project" data-project="elements">
        <img class="project-image" src="assets/master-of-elements-cover.png" alt="Silhouette of an elemental dancer surrounded by sweeping red energy">
        <div class="project-content">
          <div>
            <p class="project-type">Movement game · Role-playing game</p>
            <h2>Master of Elements</h2>
            <p class="project-summary">A board game you can play without a table.</p>
          </div>
          <a class="open-project" href="master-of-elements/index.html" aria-label="Open Master of Elements project">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 18 18 6M9 6h9v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </article>
    </section>

  </main>

  <dialog id="case-dialog" aria-labelledby="case-title">
    <button class="close-dialog" type="button" aria-label="Close project">×</button>
    <div class="case-study">
      <div class="case-visual">
        <img id="case-image" src="" alt="">
      </div>
      <div class="case-body">
        <p class="case-kicker" id="case-kicker"></p>
        <h3 id="case-title"></h3>
        <p class="case-lede" id="case-lede"></p>
        <div class="case-meta">
          <span id="case-role"></span>
          <span id="case-focus"></span>
        </div>
      </div>
    </div>
  </dialog>

  <script>
    const projects = {
      blanc: {
        kicker: "Creative learning · Card game",
        title: "Blanc Card",
        image: "assets/blanc-card.png",
        alt: "Blank cards unfolding into a glowing world of possibilities",
        accent: "#b18462",
        lede: "A blank card is not missing content—it is space for a learner to make meaning.",
        role: "Learning game design",
        focus: "Creative confidence"
      }
    };

    const dialog = document.querySelector("#case-dialog");
    const closeButton = dialog.querySelector(".close-dialog");
    const fields = {
      image: document.querySelector("#case-image"),
      kicker: document.querySelector("#case-kicker"),
      title: document.querySelector("#case-title"),
      lede: document.querySelector("#case-lede"),
      role: document.querySelector("#case-role"),
      focus: document.querySelector("#case-focus")
    };

    document.querySelectorAll(".project").forEach(card => {
      card.addEventListener("pointermove", event => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty("--mx", `${((event.clientX - rect.left) / rect.width) * 100}%`);
        card.style.setProperty("--my", `${((event.clientY - rect.top) / rect.height) * 100}%`);
      });
      card.addEventListener("pointerleave", () => {
        card.style.setProperty("--mx", "50%");
        card.style.setProperty("--my", "50%");
      });
    });

    document.querySelectorAll("[data-open]").forEach(button => {
      button.addEventListener("click", () => {
        const project = projects[button.dataset.open];
        fields.image.src = project.image;
        fields.image.alt = project.alt;
        fields.kicker.textContent = project.kicker;
        fields.title.textContent = project.title;
        fields.lede.textContent = project.lede;
        fields.role.textContent = project.role;
        fields.focus.textContent = project.focus;
        dialog.style.setProperty("--case-accent", project.accent);
        dialog.showModal();
        document.body.style.overflow = "hidden";
      });
    });

    const closeDialog = () => {
      dialog.close();
      document.body.style.overflow = "";
    };

    closeButton.addEventListener("click", closeDialog);
    dialog.addEventListener("click", event => {
      if (event.target === dialog) closeDialog();
    });
    dialog.addEventListener("close", () => { document.body.style.overflow = ""; });
  </script>
</body>
</html>
